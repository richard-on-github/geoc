name: Deploy GEOC App to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Déploiement automatique sur le VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "=== 1. Mise à jour du Backend ==="
            cd /var/www/apps/geoc/backend
            git pull origin main
            npm ci
            npx prisma migrate deploy
            chmod +x node_modules/7zip-bin/linux/x64/7za 2>/dev/null || true
            npm run build
            pm2 restart geoc-backend

            echo "=== 2. Mise à jour du Frontend ==="
            cd /var/www/apps/geoc/frontend
            git pull origin main
            npm ci
            npm run build

            echo "=== Déploiement terminé avec succès ! ==="